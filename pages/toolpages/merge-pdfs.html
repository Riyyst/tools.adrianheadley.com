<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Tools | Merge PDFs</title>
<meta name="description" content="Merge multiple PDF files directly in your browser. Page order follows upload order."/>
<meta name="theme-color" content="#f5f5f7"/>

<style>
  :root{
    --bg:#f5f5f7;
    --bg-alt:#ffffff;
    --text:#111827;
    --text-soft:#4b5563;
    --accent:#2563eb;
    --accent-hover:#1d4ed8;
    --accent-soft:rgba(37,99,235,.08);
    --border-subtle:#e5e7eb;
    --border-strong:#d1d5db;
    --shadow-soft:0 12px 30px rgba(15,23,42,.08);
    --shadow-lift:0 18px 36px rgba(15,23,42,.12);
    --radius:20px;
    --radius-pill:999px;
    --max-w:980px;
    --gap:14px;
    --stack-gap:14px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;scroll-behavior:smooth;min-height:100%;overflow-x:hidden}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    color:var(--text);
    font:16px/1.6 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  main{flex:1}
  .container{width:min(var(--max-w),100% - 3rem);margin-inline:auto}

  .skip-link{
    position:absolute;
    left:-999px;
    top:.5rem;
    padding:.45rem .75rem;
    background:#111827;
    color:#f9fafb;
    z-index:100;
    border-radius:var(--radius-pill);
    font-size:.85rem;
  }
  .skip-link:focus{left:.5rem}

  header.site-header{
    position:sticky;
    top:0;
    z-index:50;
    border-bottom:1px solid rgba(148,163,184,.28);
    backdrop-filter:blur(16px);
    background:rgba(248,250,252,.95);
  }
  .mast{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:58px;
    padding:.55rem 0;
  }
  .nav__list{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.55rem;
    list-style:none;
    margin:0;
    padding:0;
    flex-wrap:wrap;
    font-size:.86rem;
  }
  .nav__link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:.3rem .8rem;
    border-radius:var(--radius-pill);
    color:var(--text-soft);
    border:1px solid transparent;
    transition:background .16s,color .16s,transform .12s,border-color .16s;
  }
  .nav__link:hover,.nav__link:focus-visible{
    background:rgba(148,163,184,.18);
    color:var(--text);
    transform:translateY(-1px);
    text-decoration:none;
    border-color:rgba(148,163,184,.26);
  }
  .nav__link--highlight{background:var(--accent-soft);color:var(--accent);border-color:rgba(37,99,235,.18)}

  .intro{
    text-align:center;
    padding:2.6rem 0 2.4rem;
  }
  .intro__title{
    font-size:clamp(2.1rem,3vw,2.6rem);
    line-height:1.15;
    margin:0 0 .8rem;
    font-weight:750;
    letter-spacing:-.03em;
  }
  .intro__subtitle{
    max-width:650px;
    margin:0 auto;
    color:var(--text-soft);
    font-size:.96rem;
    font-weight:500;
  }

  .tool{padding:2.4rem 0 4rem}
  .card{
    background:rgba(255,255,255,.92);
    border:1px solid var(--border-subtle);
    border-radius:24px;
    box-shadow:var(--shadow-soft);
    padding:clamp(1.2rem,3vw,1.7rem);
    max-width:980px;
    margin:0 auto;
    transition:box-shadow .16s,transform .16s,border-color .16s;
  }
  .card:hover{box-shadow:var(--shadow-lift);border-color:rgba(37,99,235,.18)}

  .row{
    display:flex;
    justify-content:center;
    gap:var(--gap);
    flex-wrap:wrap;
    margin-top:var(--gap);
  }
  .row:first-child{margin-top:0}
  .full{
    min-width:260px;
    max-width:100%;
    flex:1 1 640px;
  }

  label{
    display:block;
    margin:0 0 .35rem;
    color:var(--text-soft);
    font-size:.85rem;
    font-weight:700;
  }

  .drop-merge{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:.5rem;
    min-height:158px;
    padding:1.35rem;
    border:2px dashed var(--border-strong);
    border-radius:20px;
    background:#f8fafc;
    color:var(--text-soft);
    text-align:center;
    cursor:pointer;
    transition:border-color .16s,background .16s,box-shadow .16s,transform .14s;
    font-weight:650;
  }
  .drop-merge:hover,.drop-merge.dragover,.drop-merge:focus-within{
    border-color:var(--accent);
    background:#f4f8ff;
    box-shadow:0 0 0 4px rgba(37,99,235,.08);
    transform:translateY(-1px);
  }
  .drop-merge input[type="file"]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  #dropText{
    display:block;
    color:var(--text);
    font-size:1rem;
    font-weight:750;
  }

  .filename{
    margin-top:.65rem;
    text-align:center;
    color:var(--text-soft);
    font-size:.88rem;
    font-weight:650;
    overflow-wrap:anywhere;
  }
  .filename.error{
    color:#b91c1c;
    min-height:1.4rem;
  }

  .filelist{
    margin:1rem auto 0;
    max-width:720px;
    border:1px solid var(--border-subtle);
    border-radius:18px;
    background:#f8fafc;
    padding:.5rem;
  }
  .filelist ol{
    margin:0;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:.45rem;
  }
  .filelist li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
    border:1px solid var(--border-subtle);
    border-radius:14px;
    background:#fff;
    padding:.6rem .7rem;
  }
  .filelist .name{
    min-width:0;
    overflow-wrap:anywhere;
    color:var(--text);
    font-size:.88rem;
    font-weight:650;
  }
  .filelist .remove{
    width:32px;
    height:32px;
    border-radius:999px;
    border:1px solid rgba(185,28,28,.18);
    background:rgba(185,28,28,.08);
    color:#b91c1c;
    cursor:pointer;
    font-size:1.1rem;
    font-weight:800;
    line-height:1;
    transition:background .16s,transform .14s,border-color .16s;
  }
  .filelist .remove:hover{
    transform:translateY(-1px);
    background:rgba(185,28,28,.14);
    border-color:rgba(185,28,28,.28);
  }

  .progress{
    margin-top:.8rem;
    text-align:center;
    color:var(--text-soft);
    font-size:.9rem;
    font-weight:650;
    min-height:1.4rem;
  }

  .actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.7rem;
    flex-wrap:wrap;
    margin-top:var(--stack-gap);
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.55rem;
    padding:.65rem 1.3rem;
    border-radius:var(--radius-pill);
    border:1px solid transparent;
    background:var(--accent);
    color:#f9fafb;
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    box-shadow:none;
    transition:background .16s,color .16s,border-color .16s,transform .14s,box-shadow .16s;
    font-family:inherit;
    min-height:44px;
  }
  .btn:hover:not([disabled]){
    transform:translateY(-1px);
    background:var(--accent-hover);
    text-decoration:none;
    box-shadow:0 10px 25px rgba(37,99,235,.18);
  }
  .btn:active:not([disabled]){transform:translateY(0)}
  .btn[disabled]{
    opacity:.45;
    cursor:not-allowed;
  }
  #clear{
    background:transparent;
    color:var(--text);
    border-color:rgba(148,163,184,.8);
    box-shadow:none;
  }
  #clear:hover:not([disabled]){
    background:rgba(148,163,184,.15);
    box-shadow:none;
  }
  .hidden{display:none!important}

  footer.site-footer{
    margin-top:auto;
    padding:1.6rem 1.5rem 1.8rem;
    font-size:.85rem;
    color:var(--text-soft);
    border-top:1px solid rgba(148,163,184,.3);
    background:rgba(248,250,252,.72);
  }
  .fine{font-size:.95rem;color:var(--text-soft)}
  .footer-legal{
    margin-top:.45rem;
    display:flex;
    justify-content:center;
    gap:.45rem;
    font-size:.82rem;
    flex-wrap:wrap;
  }
  .footer-legal a{
    color:var(--text-soft);
    padding:.25rem .55rem;
    border-radius:var(--radius-pill);
    transition:background .16s,color .16s,transform .12s;
  }
  .footer-legal a:hover{
    color:var(--accent);
    background:rgba(148,163,184,.16);
    text-decoration:none;
    transform:translateY(-1px);
  }

  @media (max-width:760px){
    .container{width:min(100% - 2rem,var(--max-w))}
    .nav__list{gap:.25rem}
    .nav__link{padding:.28rem .65rem}
    .intro{padding:2rem 0 2.1rem}
    .tool{padding:1.6rem 0 3rem}
    .actions .btn{width:100%;max-width:320px}
    .filelist li{align-items:flex-start}
  }
</style>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<!-- RIYST_INLINE_SCRIPT_START -->
<script>
/* ===== Wiring matches OCR Reader page (colors, pulsing, actions) ===== */
  const $ = s => document.querySelector(s);

  const fileInput  = $("#files");
  const dropZone   = $("#dropZone");
  const fileSummary= $("#fileSummary");
  const fileListEl = $("#fileList");
  const statusEl   = $("#status");
  const runBtn     = $("#run");
  const dlBtn      = $("#download");
  const clearBtn   = $("#clear");
  const errEl      = $("#err");

  let files = [];         // Array<File>
  let outBlob = null;
  let outName = "";

  function show(el){ el && el.classList.remove("hidden"); }
  function hide(el){ el && el.classList.add("hidden"); }
  function setStatus(m){ statusEl.textContent = m || ""; }
  function stem(name){ const i = name.toLowerCase().lastIndexOf(".pdf"); return i>-1 ? name.slice(0,i) : name; }
  function makeOutputName(){ if(!files.length) return "merged.pdf"; return stem(files[0].name) + " Merged.pdf"; }

  function updateRunVisibility(){
    if(files.length >= 2){
      runBtn.classList.remove("hidden");
      runBtn.removeAttribute("disabled");
    }else{
      runBtn.classList.add("hidden");
      runBtn.setAttribute("disabled","");
    }
  }

  function resetUI(full=true){
    setStatus(""); errEl.textContent="";
    hide(dlBtn); hide(clearBtn); dlBtn.setAttribute("disabled",""); dlBtn.removeAttribute("href");
    if(full){ files = []; fileInput.value=""; fileSummary.textContent="No files selected"; fileListEl.innerHTML=""; hide(fileListEl); }
    updateRunVisibility();
  }

  function summarizeFiles(){
    if(!files.length){ fileSummary.textContent = "No files selected"; hide(fileListEl); updateRunVisibility(); return; }
    fileSummary.textContent = files.length + " file(s) selected";
    const ol = document.createElement("ol");
    files.forEach((f, idx)=>{
      const li = document.createElement("li");
      const nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = f.name;
      const removeBtn = document.createElement("button");
      removeBtn.className = "remove";
      removeBtn.setAttribute("type","button");
      removeBtn.setAttribute("aria-label", "Remove " + f.name);
      removeBtn.dataset.index = idx;
      removeBtn.textContent = "×";
      li.appendChild(nameSpan);
      li.appendChild(removeBtn);
      ol.appendChild(li);
    });
    fileListEl.innerHTML = ""; fileListEl.appendChild(ol); show(fileListEl);
    updateRunVisibility();
  }

  // Remove handler (event delegation)
  fileListEl.addEventListener("click", (e)=>{
    const btn = e.target.closest("button.remove");
    if(!btn) return;
    const idx = parseInt(btn.dataset.index, 10);
    if(Number.isInteger(idx)){
      files.splice(idx, 1);
      summarizeFiles();
    }
  });

  dropZone.addEventListener("dragover", e=>{ e.preventDefault(); dropZone.classList.add("dragover"); });
  dropZone.addEventListener("dragleave", ()=> dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", e=>{
    e.preventDefault(); dropZone.classList.remove("dragover"); setStatus("");
    const picked = Array.from(e.dataTransfer.files || []).filter(f=>/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
    if(picked.length){ files = picked; summarizeFiles(); }
    else{ errEl.textContent = "Please drop PDF files."; }
  });

  fileInput.addEventListener("change", e=>{
    setStatus("");
    const picked = Array.from(e.target.files || []).filter(f=>/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name));
    if(picked.length){ files = picked; summarizeFiles(); }
    else{ errEl.textContent = "Please select at least 2 PDF files."; }
  });

  clearBtn.addEventListener("click", ()=> resetUI(true));
  dropZone.addEventListener("keydown", (e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fileInput.click(); } });

  async function mergePDFs(files){
    const { PDFDocument } = PDFLib;
    const out = await PDFDocument.create();
    let totalPages = 0;

    setStatus("Reading files…");
    const buffers = [];
    for(let i=0;i<files.length;i++){
      const ab = await files[i].arrayBuffer();
      buffers.push(ab);
    }

    for(let i=0;i<buffers.length;i++){
      const src = await PDFDocument.load(buffers[i]);
      const pageIndices = src.getPageIndices();
      const copied = await out.copyPages(src, pageIndices);
      copied.forEach(p=> out.addPage(p));
      totalPages += copied.length;
      setStatus(`Merged ${i+1}/${buffers.length} (${totalPages} page${totalPages!==1?"s":""})…`);
    }

    setStatus("Finalizing…");
    const bytes = await out.save({ useObjectStreams:false });
    return new Blob([bytes], { type: "application/pdf" });
  }

  runBtn.addEventListener("click", async ()=>{
    errEl.textContent = "";
    if(files.length < 2){ errEl.textContent = "Please select at least 2 PDFs to merge."; return; }
    runBtn.setAttribute("disabled","");
    hide(dlBtn); hide(clearBtn); setStatus("Starting…");

    try{
      const outName = makeOutputName();
      const outBlob = await mergePDFs(files);
      const url = URL.createObjectURL(outBlob);
      dlBtn.href = url;
      dlBtn.download = outName;
      dlBtn.removeAttribute("disabled");
      show(dlBtn); show(clearBtn);
      setStatus("All done — Ready for download");
      // Hide the Merge button after success
      runBtn.classList.add("hidden");
    }catch(err){
      console.error(err);
      errEl.textContent = (err && err.message) ? err.message : "Something went wrong during merge.";
      setStatus("");
      updateRunVisibility();
    }finally{
      runBtn.removeAttribute("disabled");
    }
  });

  resetUI(true);
</script>
<!-- RIYST_INLINE_SCRIPT_END -->
