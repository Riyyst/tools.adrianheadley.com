(function(){

  const $ = sel => document.querySelector(sel);
  const fileInput = $('#fileInput');

  let selectedFiles = [];

  function supportsCanvasMime(mime){
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 1;
    try{
      return canvas.toDataURL(mime).startsWith(`data:${mime}`);
    }catch{
      return false;
    }
  }

  let progressValue = 0;
  let progressActive = false;

  function applyProgressAppearance(){
    if(progressActive){
      status.classList.add('progress-status');
      status.classList.toggle('is-complete', progressValue >= 100);
      status.style.setProperty('--progress-fill', progressValue + '%');
      status.setAttribute('role', 'progressbar');
      status.setAttribute('aria-valuemin', '0');
      status.setAttribute('aria-valuemax', '100');
      status.setAttribute('aria-valuenow', String(Math.round(progressValue)));
    }else{
      status.classList.remove('progress-status', 'is-complete');
      status.style.removeProperty('--progress-fill');
      status.removeAttribute('role');
      status.removeAttribute('aria-valuemin');
      status.removeAttribute('aria-valuemax');
      status.removeAttribute('aria-valuenow');
    }
  }

  function setStatus(message, type){
    status.textContent = message || '';
    status.className = 'status' + (type ? ' ' + type : '') + (progressActive ? ' progress-status' : '');
    applyProgressAppearance();
  }

  function setProgress(percent){
    const next = Math.max(0, Math.min(100, Number(percent) || 0));
    progressValue = Math.max(progressValue, next);
    progressActive = true;
    applyProgressAppearance();
  }

  function hideProgress(){
    progressValue = 0;
    progressActive = false;
    applyProgressAppearance();
  }

  function formatSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function extFromName(name){
    const m = String(name || '').toLowerCase().match(/\.([a-z0-9]+)$/);
    return m ? m[1] : '';
  }

  function baseName(name){
    return String(name || 'converted-file').replace(/\.[^.]+$/, '') || 'converted-file';
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, ch => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[ch]));
  }

  function stripHtml(str){
    const doc = new DOMParser().parseFromString(String(str), 'text/html');
    return doc.body ? doc.body.textContent.trim() : String(str).replace(/<[^>]*>/g, '').trim();
  }

  function detectKind(file){
    const ext = extFromName(file.name);
    const type = file.type || '';

    if(['heic','heif'].includes(ext) || ['image/heic','image/heif'].includes(type)) return 'heic';
    if(type === 'image/svg+xml' || ext === 'svg') return 'svg';
    if(type.startsWith('image/') || ['png','jpg','jpeg','webp','bmp','gif','avif','ico'].includes(ext)) return 'image';
    if(type.startsWith('video/') || ['webm','mp4','mov','m4v','ogg','ogv'].includes(ext)) return 'video';
    if(type.startsWith('audio/') || ['mp3','wav','ogg','oga','m4a','aac','flac'].includes(ext)) return 'audio';
    if(type === 'application/pdf' || ext === 'pdf') return 'pdf';
    if(type.includes('wordprocessingml') || ext === 'docx') return 'docx';
    if(type === 'application/json' || ext === 'json') return 'json';
    if(type === 'text/csv' || ext === 'csv') return 'csv';
    if(type === 'text/tab-separated-values' || ext === 'tsv') return 'tsv';
    if(['md','markdown'].includes(ext)) return 'markdown';
    if(['html','htm'].includes(ext) || type === 'text/html') return 'html';
    if(['xml'].includes(ext) || type.includes('xml')) return 'xml';
    if(type.startsWith('text/') || ['txt','log'].includes(ext)) return 'text';

    return 'unknown';
  }

  function kindLabel(kind, ext){
    const labels = {
      image:`Image (${ext || 'detected'})`,
      heic:'HEIC/HEIF image',
      svg:'SVG image',
      video:`Video (${ext || 'detected'})`,
      audio:`Audio (${ext || 'detected'})`,
      pdf:'PDF document',
      docx:'Word document (.docx)',
      json:'JSON file',
      csv:'CSV file',
      tsv:'TSV file',
      markdown:'Markdown file',
      html:'HTML file',
      xml:'XML file',
      text:`Text file (${ext || 'detected'})`,
      unknown:'This file type is not supported'
    };
    return labels[kind] || 'This file type is not supported';
  }

  function availableTargets(kind){
    return (targets[kind] || []).filter(item => !item.needs || item.needs());
  }

  function targetsForFile(file){
    const kind = detectKind(file);
    return availableTargets(kind);
  }

  function commonTargets(files){
    if(!files.length) return [];
    const first = targetsForFile(files[0]);
    const others = files.slice(1).map(file => new Set(targetsForFile(file).map(item => item.value)));
    return first.filter(item => others.every(set => set.has(item.value)));
  }

  function setTargets(files){
    const list = commonTargets(files);
    toType.innerHTML = '';

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = list.length ? 'Select output format' : 'No common output format';
    toType.appendChild(placeholder);

    list.forEach(item => {
      const option = document.createElement('option');
      option.value = item.value;
      option.textContent = item.label;
      toType.appendChild(option);
    });

    if(list.length === 1){
      toType.value = list[0].value;
    }

    updateControls();
  }

  function updateControls(){
    convertBtn.disabled = !selectedFiles.length || !toType.value;
  }

  function renderSelectedFiles(){
    selectedFilesEl.innerHTML = '';

    const summary = document.createElement('p');
    summary.className = 'selected-files__summary';
    summary.textContent = selectedFiles.length === 1
      ? '1 file selected'
      : `${selectedFiles.length} files selected`;
    selectedFilesEl.appendChild(summary);

    selectedFiles.forEach(file => {
      const row = document.createElement('div');
      row.className = 'selected-file';

      const name = document.createElement('div');
      name.className = 'selected-file__name';
      name.textContent = file.name || 'Untitled file';

      const meta = document.createElement('div');
      meta.className = 'selected-file__meta';
      const kind = detectKind(file);
      meta.textContent = `${kindLabel(kind, extFromName(file.name))} · ${formatSize(file.size || 0)}`;

      row.append(name, meta);
      selectedFilesEl.appendChild(row);
    });
  }

  function handleFiles(files){
    hideProgress();
    setStatus('', '');
    selectedFiles = Array.from(files || []).filter(Boolean);
    currentFile = selectedFiles[0] || null;
    currentExt = currentFile ? extFromName(currentFile.name) : null;
    currentKind = currentFile ? detectKind(currentFile) : null;

    if(!selectedFiles.length){
      clearAll();
      return;
    }

    filePanel.classList.remove('hidden');
    renderSelectedFiles();

    const unsupported = selectedFiles.filter(file => detectKind(file) === 'unknown');
    if(unsupported.length){
      toType.innerHTML = '<option value="">Unsupported file included</option>';
      convertBtn.disabled = true;
      setStatus(
        unsupported.length === 1
          ? `${unsupported[0].name} is not a supported file type.`
          : `${unsupported.length} selected files are not supported.`,
        'err'
      );
      return;
    }

    setTargets(selectedFiles);

    if(!commonTargets(selectedFiles).length){
      setStatus('These files do not share a compatible output format. Try files of the same or compatible types.', 'err');
      return;
    }

    setStatus('', '');
  }

  function uniqueBatchName(filename){
    const original = String(filename || 'converted-file');
    if(!batchNames.has(original)){
      batchNames.add(original);
      return original;
    }

    const dot = original.lastIndexOf('.');
    const stem = dot > 0 ? original.slice(0, dot) : original;
    const ext = dot > 0 ? original.slice(dot) : '';
    let n = 2;
    let candidate = `${stem}-${n}${ext}`;
    while(batchNames.has(candidate)){
      n++;
      candidate = `${stem}-${n}${ext}`;
    }
    batchNames.add(candidate);
    return candidate;
  }

  function downloadBlob(blob, filename){
    if(batchZip){
      batchZip.file(uniqueBatchName(filename), blob);
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    requestAnimationFrame(() => {
      a.click();
      setTimeout(() => {
        a.remove();
        URL.revokeObjectURL(url);
      }, 1200);
    });
  }

  function readAsDataUrl(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Could not read that file. Try another file.'));
      reader.readAsDataURL(file);
    });
  }

  function loadImage(source){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = source instanceof Blob ? URL.createObjectURL(source) : source;
      img.onload = () => {
        if(source instanceof Blob) URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = () => {
        if(source instanceof Blob) URL.revokeObjectURL(url);
        reject(new Error('This image format cannot be decoded by this browser.'));
      };
      img.src = url;
    });
  }

  function dataUrlToBlob(dataURL){
    const parts = dataURL.split(',');
    const mime = parts[0].match(/:(.*?);/)[1];
    const bin = atob(parts[1]);
    const arr = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type:mime});
  }

  function canvasToBlob(canvas, mime, qualityValue){
    return new Promise(resolve => canvas.toBlob(resolve, mime, qualityValue));
  }

  function canvasToBmpBlob(canvas){
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    const imageData = ctx.getImageData(0, 0, w, h).data;
    const rowSize = Math.floor((24 * w + 31) / 32) * 4;
    const pixelArraySize = rowSize * h;
    const fileSize = 54 + pixelArraySize;
    const buffer = new ArrayBuffer(fileSize);
    const dv = new DataView(buffer);

    function writeString(offset, str){
      for(let i = 0; i < str.length; i++) dv.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, 'BM');
    dv.setUint32(2, fileSize, true);
    dv.setUint32(10, 54, true);
    dv.setUint32(14, 40, true);
    dv.setInt32(18, w, true);
    dv.setInt32(22, h, true);
    dv.setUint16(26, 1, true);
    dv.setUint16(28, 24, true);
    dv.setUint32(34, pixelArraySize, true);

    let offset = 54;
    for(let y = h - 1; y >= 0; y--){
      let rowOffset = offset;
      for(let x = 0; x < w; x++){
        const i = (y * w + x) * 4;
        dv.setUint8(rowOffset++, imageData[i + 2]);
        dv.setUint8(rowOffset++, imageData[i + 1]);
        dv.setUint8(rowOffset++, imageData[i]);
      }
      while((rowOffset - offset) < rowSize) dv.setUint8(rowOffset++, 0);
      offset += rowSize;
    }

    return new Blob([buffer], {type:'image/bmp'});
  }

  async function imageFileToCanvas(file){
    const img = await loadImage(file);
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || img.width;
    canvas.height = img.naturalHeight || img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    return canvas;
  }

  async function heicToBlob(file, target){
    if(!window.heic2any){
      throw new Error('HEIC support could not load. Please check your internet connection and try again.');
    }
    const toType = target === 'png' ? 'image/png' : 'image/jpeg';
    const converted = await heic2any({blob:file, toType, quality:Number(quality.value || 0.86)});
    return Array.isArray(converted) ? converted[0] : converted;
  }

  async function convertHeic(file, target){
    if(target === 'base64'){
      const blob = await heicToBlob(file, 'jpg');
      const dataUrl = await readAsDataUrl(blob);
      downloadBlob(new Blob([dataUrl], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}-base64.txt`);
      setStatus('HEIC converted to Base64 text and downloaded.', 'ok');
      return;
    }

    const actualTarget = target === 'webp' ? 'jpg' : target;
    const blob = await heicToBlob(file, actualTarget);
    if(target === 'webp'){
      const tempFile = new File([blob], `${baseName(file.name)}.jpg`, {type:'image/jpeg'});
      await convertImage(tempFile, 'webp');
      return;
    }

    downloadBlob(blob, `${baseName(file.name)}.${target === 'png' ? 'png' : 'jpg'}`);
    setStatus('HEIC/HEIF converted and downloaded.', 'ok');
  }

  async function convertImage(file, target){
    const canvas = await imageFileToCanvas(file);
    const q = Number(quality.value || 0.86);

    if(target === 'pdf'){
      if(!window.jspdf) throw new Error('PDF library could not load. Please check your internet connection and try again.');
      const { jsPDF } = window.jspdf;
      const imgData = canvas.toDataURL('image/jpeg', q);
      const orientation = canvas.width >= canvas.height ? 'landscape' : 'portrait';
      const pdf = new jsPDF({orientation, unit:'px', format:[canvas.width, canvas.height]});
      pdf.addImage(imgData, 'JPEG', 0, 0, canvas.width, canvas.height);
      downloadBlob(pdf.output('blob'), `${baseName(file.name)}.pdf`);
      setStatus('Image converted to PDF and downloaded.', 'ok');
      return;
    }

    if(target === 'base64'){
      const data = canvas.toDataURL(file.type || 'image/png', q);
      downloadBlob(new Blob([data], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}-base64.txt`);
      setStatus('Base64 text downloaded.', 'ok');
      return;
    }

    if(target === 'bmp'){
      downloadBlob(canvasToBmpBlob(canvas), `${baseName(file.name)}.bmp`);
      setStatus('Image converted to BMP and downloaded.', 'ok');
      return;
    }

    if(target === 'ico'){
      const iconCanvas = document.createElement('canvas');
      iconCanvas.width = 256;
      iconCanvas.height = 256;
      const ctx = iconCanvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);
      const ratio = Math.min(256 / canvas.width, 256 / canvas.height);
      const w = canvas.width * ratio;
      const h = canvas.height * ratio;
      ctx.drawImage(canvas, (256 - w) / 2, (256 - h) / 2, w, h);
      const blob = await canvasToBlob(iconCanvas, 'image/png', q);
      downloadBlob(blob, `${baseName(file.name)}.ico`);
      setStatus('Image converted to an icon file and downloaded.', 'ok');
      return;
    }

    const mime = target === 'jpg' ? 'image/jpeg' : target === 'webp' ? 'image/webp' : target === 'avif' ? 'image/avif' : 'image/png';
    const blob = await canvasToBlob(canvas, mime, q);
    if(!blob) throw new Error('Conversion failed or this browser does not support that output format.');
    downloadBlob(blob, `${baseName(file.name)}.${target}`);
    setStatus('Image converted and downloaded.', 'ok');
  }

  async function svgToImageBlob(file, target){
    const text = await file.text();

    if(target === 'txt'){
      downloadBlob(new Blob([text], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.txt`);
      setStatus('SVG source downloaded as text.', 'ok');
      return;
    }

    if(target === 'base64'){
      const dataUrl = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(text)));
      downloadBlob(new Blob([dataUrl], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}-base64.txt`);
      setStatus('SVG converted to Base64 text and downloaded.', 'ok');
      return;
    }

    const svgBlob = new Blob([text], {type:'image/svg+xml'});
    const img = await loadImage(svgBlob);
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth || 1200;
    canvas.height = img.naturalHeight || 800;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);

    if(target === 'pdf'){
      if(!window.jspdf) throw new Error('PDF library could not load. Please check your internet connection and try again.');
      const { jsPDF } = window.jspdf;
      const orientation = canvas.width >= canvas.height ? 'landscape' : 'portrait';
      const pdf = new jsPDF({orientation, unit:'px', format:[canvas.width, canvas.height]});
      pdf.addImage(canvas.toDataURL('image/jpeg', Number(quality.value || 0.86)), 'JPEG', 0, 0, canvas.width, canvas.height);
      downloadBlob(pdf.output('blob'), `${baseName(file.name)}.pdf`);
      setStatus('SVG converted to PDF and downloaded.', 'ok');
      return;
    }

    const mime = target === 'jpg' ? 'image/jpeg' : target === 'webp' ? 'image/webp' : target === 'avif' ? 'image/avif' : 'image/png';
    const blob = await canvasToBlob(canvas, mime, Number(quality.value || 0.86));
    if(!blob) throw new Error('Conversion failed or this browser does not support that output format.');
    downloadBlob(blob, `${baseName(file.name)}.${target}`);
    setStatus('SVG converted and downloaded.', 'ok');
  }

  function parseDelimited(text, delimiter){
    const rows = [];
    let row = [];
    let cell = '';
    let inQuotes = false;

    for(let i = 0; i < text.length; i++){
      const ch = text[i];
      const next = text[i + 1];

      if(ch === '"' && inQuotes && next === '"'){
        cell += '"';
        i++;
      }else if(ch === '"'){
        inQuotes = !inQuotes;
      }else if(ch === delimiter && !inQuotes){
        row.push(cell);
        cell = '';
      }else if((ch === '\n' || ch === '\r') && !inQuotes){
        if(ch === '\r' && next === '\n') i++;
        row.push(cell);
        if(row.some(v => v !== '')) rows.push(row);
        row = [];
        cell = '';
      }else{
        cell += ch;
      }
    }

    row.push(cell);
    if(row.some(v => v !== '')) rows.push(row);
    return rows;
  }

  function rowsToObjects(rows){
    if(!rows.length) return [];
    const headers = rows[0].map((h, i) => h || `Column ${i + 1}`);
    return rows.slice(1).map(r => {
      const obj = {};
      headers.forEach((h, i) => obj[h] = r[i] ?? '');
      return obj;
    });
  }

  function toCsvValue(v, delimiter = ','){
    const s = String(v ?? '');
    if(s.includes('"') || s.includes('\n') || s.includes('\r') || s.includes(delimiter)){
      return '"' + s.replace(/"/g, '""') + '"';
    }
    return s;
  }

  function objectsToCsv(data, delimiter = ','){
    const rows = Array.isArray(data) ? data : [data];
    const keys = [...new Set(rows.flatMap(obj => obj && typeof obj === 'object' && !Array.isArray(obj) ? Object.keys(obj) : ['value']))];

    const lines = [keys.map(k => toCsvValue(k, delimiter)).join(delimiter)];
    rows.forEach(item => {
      const obj = item && typeof item === 'object' && !Array.isArray(item) ? item : {value:item};
      lines.push(keys.map(k => toCsvValue(obj[k], delimiter)).join(delimiter));
    });
    return lines.join('\n');
  }

  function rowsToHtmlTable(rows){
    const body = rows.map((row, index) => {
      const tag = index === 0 ? 'th' : 'td';
      return '<tr>' + row.map(cell => `<${tag}>${escapeHtml(cell)}</${tag}>`).join('') + '</tr>';
    }).join('\n');

    return `<!DOCTYPE html>
<html lang="en">

  function markdownToHtml(text){
    const lines = String(text).split(/\r?\n/);
    return lines.map(line => {
      if(/^###\s+/.test(line)) return `<h3>${escapeHtml(line.replace(/^###\s+/, ''))}</h3>`;
      if(/^##\s+/.test(line)) return `<h2>${escapeHtml(line.replace(/^##\s+/, ''))}</h2>`;
      if(/^#\s+/.test(line)) return `<h1>${escapeHtml(line.replace(/^#\s+/, ''))}</h1>`;
      if(/^\s*[-*]\s+/.test(line)) return `<p>• ${escapeHtml(line.replace(/^\s*[-*]\s+/, ''))}</p>`;
      if(!line.trim()) return '';
      return `<p>${escapeHtml(line)}</p>`;
    }).join('\n');
  }

  function htmlDocument(title, body){
    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>${escapeHtml(title)}</title>
<style>body{font-family:Arial,sans-serif;line-height:1.6;padding:2rem;max-width:900px;margin:auto}</style>
</head>
<body>
${body}
</body>
</html>`;
  }

  async function textToDocx(text, filename){
    if(!window.docx) throw new Error('Word document library could not load. Please check your internet connection and try again.');
    const { Document, Packer, Paragraph, TextRun } = window.docx;
    const lines = String(text).split(/\r?\n/);
    const doc = new Document({
      sections: [{
        properties: {},
        children: lines.length ? lines.map(line => new Paragraph({children:[new TextRun(line || ' ')]})) : [new Paragraph('')]
      }]
    });
    const blob = await Packer.toBlob(doc);
    downloadBlob(blob, filename);
  }

  function textToPdf(text, filename){
    if(!window.jspdf) throw new Error('PDF library could not load. Please check your internet connection and try again.');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4'});
    const margin = 40;
    const lineHeight = 14;
    const maxWidth = pdf.internal.pageSize.getWidth() - margin * 2;
    let y = margin;

    String(text).split(/\r?\n/).forEach(rawLine => {
      const lines = pdf.splitTextToSize(rawLine || ' ', maxWidth);
      lines.forEach(line => {
        if(y > pdf.internal.pageSize.getHeight() - margin){
          pdf.addPage();
          y = margin;
        }
        pdf.text(line, margin, y);
        y += lineHeight;
      });
    });

    downloadBlob(pdf.output('blob'), filename);
  }

  async function convertTextFile(file, kind, target){
    const text = await file.text();
    let output = text;
    let ext = target;

    if(kind === 'json'){
      const parsed = JSON.parse(text);
      if(target === 'json-pretty'){
        output = JSON.stringify(parsed, null, 2);
        ext = 'json';
      }else if(target === 'json-min'){
        output = JSON.stringify(parsed);
        ext = 'json';
      }else if(target === 'csv'){
        output = objectsToCsv(parsed);
        ext = 'csv';
      }else if(target === 'html'){
        output = htmlDocument(baseName(file.name), `<pre>${escapeHtml(JSON.stringify(parsed, null, 2))}</pre>`);
        ext = 'html';
      }else{
        output = JSON.stringify(parsed, null, 2);
        ext = 'txt';
      }
      downloadBlob(new Blob([output], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.${ext}`);
      setStatus('Converted and downloaded.', 'ok');
      return;
    }

    if(kind === 'csv' || kind === 'tsv'){
      const delimiter = kind === 'tsv' ? '\t' : ',';
      const rows = parseDelimited(text, delimiter);

      if(target === 'json'){
        output = JSON.stringify(rowsToObjects(rows), null, 2);
        ext = 'json';
      }else if(target === 'csv'){
        output = rows.map(r => r.map(v => toCsvValue(v, ',')).join(',')).join('\n');
        ext = 'csv';
      }else if(target === 'tsv'){
        output = rows.map(r => r.map(v => toCsvValue(v, '\t')).join('\t')).join('\n');
        ext = 'tsv';
      }else if(target === 'html-table'){
        output = rowsToHtmlTable(rows);
        ext = 'html';
      }else{
        output = text;
        ext = 'txt';
      }

      downloadBlob(new Blob([output], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.${ext}`);
      setStatus('Converted and downloaded.', 'ok');
      return;
    }

    if(kind === 'markdown'){
      if(target === 'html'){
        output = htmlDocument(baseName(file.name), markdownToHtml(text));
        ext = 'html';
      }else if(target === 'docx'){
        await textToDocx(text, `${baseName(file.name)}.docx`);
        setStatus('Converted to Word and downloaded.', 'ok');
        return;
      }else if(target === 'pdf'){
        textToPdf(text, `${baseName(file.name)}.pdf`);
        setStatus('Converted to PDF and downloaded.', 'ok');
        return;
      }else{
        output = text;
        ext = 'txt';
      }
      downloadBlob(new Blob([output], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.${ext}`);
      setStatus('Converted and downloaded.', 'ok');
      return;
    }

    if(kind === 'html'){
      output = stripHtml(text);
      if(target === 'md'){
        ext = 'md';
      }else if(target === 'pdf'){
        textToPdf(output, `${baseName(file.name)}.pdf`);
        setStatus('Converted to PDF and downloaded.', 'ok');
        return;
      }else{
        ext = 'txt';
      }
      downloadBlob(new Blob([output], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.${ext}`);
      setStatus('Converted and downloaded.', 'ok');
      return;
    }

    if(kind === 'xml'){
      if(target === 'json-basic'){
        const doc = new DOMParser().parseFromString(text, 'application/xml');
        if(doc.querySelector('parsererror')) throw new Error('This is not valid XML.');
        output = JSON.stringify(xmlNodeToObject(doc.documentElement), null, 2);
        ext = 'json';
      }else if(target === 'html-escaped'){
        output = htmlDocument(baseName(file.name), `<pre>${escapeHtml(text)}</pre>`);
        ext = 'html';
      }else{
        output = text;
        ext = 'txt';
      }
      downloadBlob(new Blob([output], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.${ext}`);
      setStatus('Converted and downloaded.', 'ok');
      return;
    }

    if(target === 'html'){
      output = htmlDocument(baseName(file.name), `<pre>${escapeHtml(text)}</pre>`);
      ext = 'html';
    }else if(target === 'json-string'){
      output = JSON.stringify({filename:file.name, text}, null, 2);
      ext = 'json';
    }else if(target === 'docx'){
      await textToDocx(text, `${baseName(file.name)}.docx`);
      setStatus('Converted to Word and downloaded.', 'ok');
      return;
    }else if(target === 'pdf'){
      textToPdf(text, `${baseName(file.name)}.pdf`);
      setStatus('Converted to PDF and downloaded.', 'ok');
      return;
    }else if(target === 'md'){
      output = text;
      ext = 'md';
    }else{
      output = text;
      ext = 'txt';
    }

    downloadBlob(new Blob([output], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.${ext}`);
    setStatus('Converted and downloaded.', 'ok');
  }

  function xmlNodeToObject(node){
    const obj = {};
    if(node.attributes && node.attributes.length){
      obj['@attributes'] = {};
      Array.from(node.attributes).forEach(attr => obj['@attributes'][attr.name] = attr.value);
    }
    const children = Array.from(node.children || []);
    if(children.length){
      children.forEach(child => {
        const value = xmlNodeToObject(child);
        if(obj[child.nodeName]){
          if(!Array.isArray(obj[child.nodeName])) obj[child.nodeName] = [obj[child.nodeName]];
          obj[child.nodeName].push(value);
        }else{
          obj[child.nodeName] = value;
        }
      });
    }else{
      obj['#text'] = node.textContent || '';
    }
    return obj;
  }

  async function extractPdfPages(file){
    if(!window.pdfjsLib) throw new Error('PDF library could not load. Please check your internet connection and try again.');
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
    const pages = [];

    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const text = content.items.map(item => item.str).join(' ').replace(/\s+/g, ' ').trim();
      pages.push({page:i, text});
    }

    return pages;
  }

  async function extractPdfText(file){
    const pages = await extractPdfPages(file);
    return pages.map(p => `Page ${p.page}\n${p.text}`).join('\n\n');
  }

  async function convertPdf(file, target){
    if(target === 'png-zip' || target === 'jpg-zip' || target === 'webp-zip'){
      if(!window.pdfjsLib || !window.JSZip) throw new Error('PDF or ZIP library could not load. Please check your internet connection and try again.');
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
      const zip = new JSZip();
      const scale = Number(pdfScale.value || 1.5);
      const isJpg = target === 'jpg-zip';
      const isWebp = target === 'webp-zip';

      for(let i = 1; i <= pdf.numPages; i++){
        setStatus(`Rendering page ${i} of ${pdf.numPages}...`, '');
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({scale});
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        const ctx = canvas.getContext('2d');
        if(isJpg){
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        await page.render({canvasContext:ctx, viewport}).promise;
        const mime = isJpg ? 'image/jpeg' : isWebp ? 'image/webp' : 'image/png';
        const ext = isJpg ? 'jpg' : isWebp ? 'webp' : 'png';
        const blob = await canvasToBlob(canvas, mime, Number(quality.value || 0.86));
        zip.file(`${baseName(file.name)}-page-${String(i).padStart(3, '0')}.${ext}`, blob);
      }

      const zipBlob = await zip.generateAsync({type:'blob'});
      downloadBlob(zipBlob, `${baseName(file.name)}-pages.zip`);
      setStatus('PDF pages converted and downloaded as ZIP.', 'ok');
      return;
    }

    const pages = target === 'json-pages' ? await extractPdfPages(file) : null;
    const text = pages ? pages.map(p => `Page ${p.page}\n${p.text}`).join('\n\n') : await extractPdfText(file);

    if(target === 'json-pages'){
      downloadBlob(new Blob([JSON.stringify(pages, null, 2)], {type:'application/json;charset=utf-8'}), `${baseName(file.name)}.json`);
      setStatus('PDF text extracted as JSON and downloaded.', 'ok');
      return;
    }

    if(target === 'txt'){
      downloadBlob(new Blob([text], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.txt`);
      setStatus('PDF text extracted and downloaded.', 'ok');
      return;
    }

    await textToDocx(text, `${baseName(file.name)}.docx`);
    setStatus('PDF text extracted to Word and downloaded.', 'ok');
  }

  async function convertDocx(file, target){
    if(!window.mammoth) throw new Error('Word extraction library could not load. Please check your internet connection and try again.');
    const buffer = await file.arrayBuffer();

    if(target === 'html'){
      const result = await mammoth.convertToHtml({arrayBuffer:buffer});
      const output = htmlDocument(baseName(file.name), result.value);
      downloadBlob(new Blob([output], {type:'text/html;charset=utf-8'}), `${baseName(file.name)}.html`);
      setStatus('Word document converted to HTML and downloaded.', 'ok');
      return;
    }

    const result = await mammoth.extractRawText({arrayBuffer:buffer});
    const text = result.value || '';

    if(target === 'pdf'){
      textToPdf(text, `${baseName(file.name)}.pdf`);
      setStatus('Word text converted to PDF and downloaded.', 'ok');
      return;
    }

    downloadBlob(new Blob([text], {type:'text/plain;charset=utf-8'}), `${baseName(file.name)}.${target === 'md' ? 'md' : 'txt'}`);
    setStatus('Word text extracted and downloaded.', 'ok');
  }

  function loadMediaElement(file, kind){
    return new Promise((resolve, reject) => {
      const el = document.createElement(kind === 'video' ? 'video' : 'audio');
      const url = URL.createObjectURL(file);
      el.preload = 'metadata';
      el.muted = true;
      el.playsInline = true;
      el.onloadedmetadata = () => resolve({el, url});
      el.onerror = () => {
        URL.revokeObjectURL(url);
        reject(new Error(`This ${kind} format cannot be decoded by this browser.`));
      };
      el.src = url;
    });
  }

  async function convertVideo(file, target){
    const {el:video, url} = await loadMediaElement(file, 'video');

    try{
      if(target === 'metadata-json'){
        const data = {
          filename:file.name,
          type:file.type || currentExt,
          size:file.size,
          duration:video.duration,
          width:video.videoWidth,
          height:video.videoHeight
        };
        downloadBlob(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}), `${baseName(file.name)}-metadata.json`);
        setStatus('Video metadata downloaded.', 'ok');
        return;
      }

      if(target.startsWith('frame-')){
        video.currentTime = Math.min(0.2, video.duration || 0);
        await new Promise(resolve => video.onseeked = resolve);
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

        const out = target.replace('frame-', '');
        const mime = out === 'jpg' ? 'image/jpeg' : out === 'webp' ? 'image/webp' : out === 'avif' ? 'image/avif' : 'image/png';
        const blob = await canvasToBlob(canvas, mime, Number(quality.value || 0.86));
        if(!blob) throw new Error('Could not export frame in that format.');
        downloadBlob(blob, `${baseName(file.name)}-frame.${out}`);
        setStatus('First frame extracted and downloaded.', 'ok');
        return;
      }

      if(target === 'webm'){
        if(!video.captureStream || !window.MediaRecorder) throw new Error('This browser cannot record video to WebM.');
        const stream = video.captureStream();
        const recorder = new MediaRecorder(stream, {mimeType:'video/webm;codecs=vp9'});
        const chunks = [];
        recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
        const stopped = new Promise(resolve => recorder.onstop = resolve);
        recorder.start();
        await video.play();
        await new Promise(resolve => video.onended = resolve);
        recorder.stop();
        await stopped;
        downloadBlob(new Blob(chunks, {type:'video/webm'}), `${baseName(file.name)}.webm`);
        setStatus('Video recorded to WebM and downloaded.', 'ok');
      }
    }finally{
      URL.revokeObjectURL(url);
    }
  }

  async function audioBufferToWavBlob(buffer){
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const length = buffer.length * numChannels * 2 + 44;
    const arrayBuffer = new ArrayBuffer(length);
    const view = new DataView(arrayBuffer);

    function writeString(offset, str){
      for(let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, length - 8, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * numChannels * 2, true);
    view.setUint16(32, numChannels * 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, length - 44, true);

    let offset = 44;
    for(let i = 0; i < buffer.length; i++){
      for(let ch = 0; ch < numChannels; ch++){
        const sample = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
        offset += 2;
      }
    }

    return new Blob([arrayBuffer], {type:'audio/wav'});
  }

  async function convertAudio(file, target){
    if(target === 'metadata-json'){
      const {el:audio, url} = await loadMediaElement(file, 'audio');
      try{
        const data = {
          filename:file.name,
          type:file.type || currentExt,
          size:file.size,
          duration:audio.duration
        };
        downloadBlob(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}), `${baseName(file.name)}-metadata.json`);
        setStatus('Audio metadata downloaded.', 'ok');
      }finally{
        URL.revokeObjectURL(url);
      }
      return;
    }

    if(target === 'webm-audio'){
      const {el:audio, url} = await loadMediaElement(file, 'audio');
      try{
        if(!audio.captureStream || !window.MediaRecorder) throw new Error('This browser cannot record audio to WebM.');
        const stream = audio.captureStream();
        const recorder = new MediaRecorder(stream, {mimeType:'audio/webm'});
        const chunks = [];
        recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
        const stopped = new Promise(resolve => recorder.onstop = resolve);
        recorder.start();
        await audio.play();
        await new Promise(resolve => audio.onended = resolve);
        recorder.stop();
        await stopped;
        downloadBlob(new Blob(chunks, {type:'audio/webm'}), `${baseName(file.name)}.webm`);
        setStatus('Audio recorded to WebM and downloaded.', 'ok');
      }finally{
        URL.revokeObjectURL(url);
      }
      return;
    }

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if(!AudioContext) throw new Error('This browser cannot decode audio files.');
    const ctx = new AudioContext();
    const buffer = await ctx.decodeAudioData(await file.arrayBuffer());
    const blob = await audioBufferToWavBlob(buffer);
    downloadBlob(blob, `${baseName(file.name)}.wav`);
    setStatus('Audio converted to WAV and downloaded.', 'ok');
  }

  async function convertOne(file, target){
    currentFile = file;
    currentExt = extFromName(file.name);
    currentKind = detectKind(file);

    if(currentKind === 'image') await convertImage(file, target);
    else if(currentKind === 'heic') await convertHeic(file, target);
    else if(currentKind === 'svg') await svgToImageBlob(file, target);
    else if(currentKind === 'video') await convertVideo(file, target);
    else if(currentKind === 'audio') await convertAudio(file, target);
    else if(currentKind === 'pdf') await convertPdf(file, target);
    else if(currentKind === 'docx') await convertDocx(file, target);
    else if(['text','json','csv','tsv','markdown','html','xml'].includes(currentKind)) await convertTextFile(file, currentKind, target);
    else throw new Error(`${file.name} is not a supported file type.`);
  }

  async function convert(){
    if(!selectedFiles.length){
      setStatus('Choose at least one file first.', 'err');
      return;
    }

    const target = toType.value;
    if(!target){
      setStatus('Select an output format first.', 'err');
      return;
    }

    const files = [...selectedFiles];
    const failures = [];
    convertBtn.disabled = true;
    hideProgress();
    setProgress(3);

    try{
      if(files.length === 1){
        batchZip = null;
        setStatus('Converting...', '');
        setProgress(12);
        await convertOne(files[0], target);
        setProgress(100);
        requestAnimationFrame(()=>setProgress(100));
        setStatus(status.textContent.trim() || 'Converted and downloaded.', 'ok');
        return;
      }

      if(!window.JSZip){
        throw new Error('Batch download support could not load. Check your connection and try again.');
      }

      batchZip = new JSZip();
      batchNames = new Set();

      for(let i = 0; i < files.length; i++){
        const file = files[i];
        setStatus(`Converting ${i + 1} of ${files.length}: ${file.name}`, '');
        try{
          await convertOne(file, target);
        }catch(err){
          failures.push({
            file:file.name,
            message:err && err.message ? err.message : 'Conversion failed.'
          });
        }
        setProgress(8 + ((i + 1) / files.length) * 80);
      }

      const convertedCount = files.length - failures.length;
      if(!convertedCount){
        throw new Error(failures[0]?.message || 'None of the selected files could be converted.');
      }

      const collectedZip = batchZip;
      batchZip = null;
      const zipBlob = await collectedZip.generateAsync({type:'blob'}, metadata => {
        setProgress(88 + ((metadata.percent || 0) * 0.11));
      });
      downloadBlob(zipBlob, `converted-files-${target}.zip`);
      setProgress(100);
      requestAnimationFrame(()=>setProgress(100));

      if(failures.length){
        hideProgress();
        setStatus(`${convertedCount} of ${files.length} files converted and downloaded as a ZIP. ${failures.length} file(s) could not be converted.`, 'err');
      }else{
        setStatus(`${convertedCount} files converted and downloaded as a ZIP.`, 'ok');
      }
    }catch(err){
      batchZip = null;
      hideProgress();
      setStatus(err.message || 'Conversion failed. Try another file or output format.', 'err');
    }finally{
      batchZip = null;
      currentFile = selectedFiles[0] || null;
      currentExt = currentFile ? extFromName(currentFile.name) : null;
      currentKind = currentFile ? detectKind(currentFile) : null;
      updateControls();
    }
  }

  function clearAll(){
    selectedFiles = [];
    currentFile = null;
    currentKind = null;
    currentExt = null;
    batchZip = null;
    batchNames = new Set();
    fileInput.value = '';
    filePanel.classList.add('hidden');
    selectedFilesEl.innerHTML = '';
    toType.innerHTML = '<option value="">Select output format</option>';
    hideProgress();
    setStatus('', '');
    updateControls();
  }

  fileInput.addEventListener('change', e => {
    handleFiles(e.target.files);
  });

  toType.addEventListener('change', updateControls);

  ['dragenter','dragover'].forEach(evt => {
    dropZone.addEventListener(evt, e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
  });

  ['dragleave','drop'].forEach(evt => {
    dropZone.addEventListener(evt, e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
    });
  });

  dropZone.addEventListener('drop', e => {
    if(e.dataTransfer.files && e.dataTransfer.files.length){
      handleFiles(e.dataTransfer.files);
    }
  });

  convertBtn.addEventListener('click', convert);
  clearBtn.addEventListener('click', clearAll);

  const y = document.getElementById('year');
  if(y) y.textContent = new Date().getFullYear();
})();
