<script>
(function(){const y=document.getElementById('year'); if(y) y.textContent=new Date().getFullYear();})();

    const qrText = document.getElementById('qrText');
    const format = document.getElementById('format');
    const dotColor = document.getElementById('dotColor');
    const bgColor = document.getElementById('bgColor');
    const bgTransparent = document.getElementById('bgTransparent');
    const eyeColor = document.getElementById('eyeColor');
    const eyeDotColor = document.getElementById('eyeDotColor');
    const logoFile = document.getElementById('logoFile');
    const logoDrop = document.getElementById('logoDrop');
    const logoPreview = document.getElementById('logoPreview');
    const logoThumb = document.getElementById('logoThumb');
    const logoName = document.getElementById('logoName');
    const mount = document.getElementById('qrMount');
    const btnDownload = document.getElementById('btnDownload');
    const btnCopy = document.getElementById('btnCopy');
    const btnClearLogo = document.getElementById('btnClearLogo');
    const logoSizeControl = document.getElementById('logoSizeControl');
    const logoSize = document.getElementById('logoSize');
    const logoSizeValue = document.getElementById('logoSizeValue');

    const dotsRadios = Array.from(document.querySelectorAll('input[name="dots"]'));
    const eyesRadios = Array.from(document.querySelectorAll('input[name="eyes"]'));
    const eyeDotsRadios = Array.from(document.querySelectorAll('input[name="eyeDots"]'));

    const FIXED_SIZE = 360;
    const FIXED_MARGIN = 4;
    const FIXED_ECC = 'H';
    let logoSizePct = 24;
    let logoRefreshTimer = null;
    let colourRefreshTimer = null;
    const DEFAULT_LOGO_MARGIN = 2;
    let logoDataUrl = null;
    const state = { dotsType:'square', cornersType:'square', cornersDotType:'square' };
    (function initStateFromRadios(){
      const d=document.querySelector('input[name="dots"]:checked'); if(d) state.dotsType=d.value;
      const e=document.querySelector('input[name="eyes"]:checked'); if(e) state.cornersType=e.value;
      const ed=document.querySelector('input[name="eyeDots"]:checked'); if(ed) state.cornersDotType=ed.value;
    })();

    // QR instance
    let qr = new QRCodeStyling({
      width: FIXED_SIZE,
      height: FIXED_SIZE,
      type: 'canvas',
      data: '',
      margin: FIXED_MARGIN,
      qrOptions: { errorCorrectionLevel: FIXED_ECC },
      backgroundOptions: { color: bgColor.value },
      dotsOptions: { color: dotColor.value, type: state.dotsType },
      cornersSquareOptions: { type: state.cornersType, color: eyeColor.value },
      cornersDotOptions: { type: state.cornersDotType, color: eyeDotColor.value },
      imageOptions: { imageSize: logoSizePct/100, margin: DEFAULT_LOGO_MARGIN, crossOrigin: 'anonymous' }
    });
    qr.append(mount);

    function mapDotsType(v){
      if(v==='rounded') return 'rounded';
      if(v==='dots') return 'dots';
      if(v==='classy') return 'classy';
      if(v==='classy-rounded') return 'classy-rounded';
      if(v==='extra-rounded') return 'extra-rounded';
      return 'square';
    }

    function refresh(){
      const isTransparent = bgTransparent.checked;
      const bg = isTransparent ? 'transparent' : bgColor.value;
      mount.classList.toggle('transparent-preview', isTransparent);
      bgColor.disabled = isTransparent;
      qr.update({
        width: FIXED_SIZE, height: FIXED_SIZE, data: qrText.value || '', margin: FIXED_MARGIN,
        qrOptions: { errorCorrectionLevel: FIXED_ECC },
        backgroundOptions: { color: bg },
        dotsOptions: { color: dotColor.value, type: mapDotsType(state.dotsType) },
        cornersSquareOptions: { type: state.cornersType, color: eyeColor.value },
        cornersDotOptions: { type: state.cornersDotType, color: eyeDotColor.value },
        image: logoDataUrl || null,
        imageOptions: { imageSize: logoSizePct/100, margin: DEFAULT_LOGO_MARGIN, crossOrigin:'anonymous' }
      });
    }

    // Segments
    dotsRadios.forEach(r => r.addEventListener('change', ()=>{ state.dotsType = r.value; refresh(); }));
    eyesRadios.forEach(r => r.addEventListener('change', ()=>{
      state.cornersType = r.value;
      refresh();
    }));

    eyeDotsRadios.forEach(r => r.addEventListener('change', ()=>{
      state.cornersDotType = r.value;
      refresh();
    }));

    qrText.addEventListener('input', refresh);
    bgTransparent.addEventListener('change', refresh);

    function closeColourPicker(input){
      window.setTimeout(function(){
        try{ input.blur(); }catch(_){}
        try{
          if(document.activeElement === input){
            document.body.setAttribute('tabindex', '-1');
            document.body.focus({preventScroll:true});
            document.body.removeAttribute('tabindex');
          }
        }catch(_){}
      }, 20);
    }

    function scheduleColourRefresh(immediate){
      clearTimeout(colourRefreshTimer);
      if(immediate){
        refresh();
        return;
      }
      colourRefreshTimer = setTimeout(refresh, 85);
    }

    [dotColor, eyeColor, eyeDotColor, bgColor].forEach(function(input){
      input.addEventListener('input', function(){
        scheduleColourRefresh(false);
      });
      input.addEventListener('change', function(){
        scheduleColourRefresh(true);
        closeColourPicker(input);
      });
    });

    // Logo upload / preview / remove
    logoFile.addEventListener('change', handleLogoFile);
    ['dragenter','dragover'].forEach(ev => logoDrop.addEventListener(ev, e => { e.preventDefault(); logoDrop.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(ev => logoDrop.addEventListener(ev, e => { e.preventDefault(); logoDrop.classList.remove('dragover'); }));
    logoDrop.addEventListener('drop', e => { const file = e.dataTransfer.files && e.dataTransfer.files[0]; if(file) setLogoFile(file); });
    logoDrop.addEventListener('click', (e) => { if(e.target.closest('#btnClearLogo')) return; logoFile.click(); });

    function handleLogoFile(e){ const file = e.target.files && e.target.files[0]; if(file) setLogoFile(file); }
    function setLogoFile(file){
      if(!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => { logoDataUrl = reader.result; showLogoPreview(file); refresh(); };
      reader.readAsDataURL(file);
    }
    function showLogoPreview(file){
      const name = file.name || 'logo';
      logoThumb.src = logoDataUrl; logoThumb.alt = name; logoName.textContent = name;
      document.querySelector('.logo-cta').style.display='none';
      logoPreview.style.display='flex';
      logoSizeControl.classList.remove('hidden');
    }
    btnClearLogo.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); clearLogo(); });
    function clearLogo(){
      logoDataUrl=null; logoFile.value=''; logoThumb.src=''; logoName.textContent='';
      logoSizePct=24; logoSize.value='24'; logoSizeValue.textContent='24%';
      logoPreview.style.display='none'; logoSizeControl.classList.add('hidden');
      document.querySelector('.logo-cta').style.display=''; refresh();
    }

    function updateLogoSizeFromSlider(){
      logoSizePct = Math.max(10, Math.min(30, Number(logoSize.value) || 24));
      logoSizeValue.textContent = logoSizePct + '%';
    }

    function scheduleLogoRefresh(immediate){
      clearTimeout(logoRefreshTimer);
      if(immediate){
        refresh();
        return;
      }
      logoRefreshTimer = setTimeout(refresh, 110);
    }

    logoSize.addEventListener('input', function(){
      updateLogoSizeFromSlider();
      scheduleLogoRefresh(false);
    });

    logoSize.addEventListener('change', function(){
      updateLogoSizeFromSlider();
      scheduleLogoRefresh(true);
    });

    // Download & Copy (same behavior as before) 
    btnDownload.addEventListener('click', async () => {
      const ext = format.value||'png';
      if(ext==='svg'){ const t=qr._options.type; qr.update({type:'svg'}); await qr.download({name:'qr-code',extension:'svg'}); qr.update({type:t}); }
      else{ await qr.download({name:'qr-code',extension:ext}); }
    });
    btnCopy.addEventListener('click', async () => {
      try{
        const t=qr._options.type; qr.update({type:'canvas'});
        const raw = await qr.getRawData('png');
        const blob = raw instanceof Blob ? raw : await (await fetch(raw)).blob();
        await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
        qr.update({type:t});
        btnCopy.textContent = 'Copied!'; setTimeout(()=> btnCopy.textContent='Copy', 900);
      }catch(e){ btnCopy.textContent='Copy failed'; setTimeout(()=> btnCopy.textContent='Copy', 900); }
    });

    // Align the QR itself with the Dots, Eyes and Eye dots controls.
    function syncPreviewToStyleControls(){
      const right = document.querySelector('.right');
      const canvas = document.querySelector('.canvas');
      const mount = document.getElementById('qrMount');
      const left = document.querySelector('.left');
      const dots = document.querySelector('.dots-section');
      const eyeDots = document.querySelector('.eye-dots-section');

      if(!right || !canvas || !mount || !left || !dots || !eyeDots) return;

      if(window.matchMedia('(max-width: 900px)').matches){
        right.style.marginTop = '';
        right.style.height = '';
        canvas.style.height = '';
        mount.style.width = '';
        mount.style.height = '';
        return;
      }

      const leftRect = left.getBoundingClientRect();
      const dotsRect = dots.getBoundingClientRect();
      const eyeDotsRect = eyeDots.getBoundingClientRect();
      const spanHeight = Math.max(1, eyeDotsRect.bottom - dotsRect.top);

      right.style.marginTop = Math.max(0, dotsRect.top - leftRect.top) + 'px';
      right.style.height = spanHeight + 'px';
      canvas.style.height = spanHeight + 'px';

      const availableWidth = Math.max(1, right.clientWidth);
      const squareSize = Math.min(spanHeight, availableWidth, 430);
      mount.style.width = squareSize + 'px';
      mount.style.height = squareSize + 'px';
    }

    window.addEventListener('resize', syncPreviewToStyleControls);
    if('ResizeObserver' in window){
      const previewObserver = new ResizeObserver(syncPreviewToStyleControls);
      const observedLeft = document.querySelector('.left');
      if(observedLeft) previewObserver.observe(observedLeft);
    }

    // Initial
    function initialiseQrPage(){
      refresh();
      requestAnimationFrame(syncPreviewToStyleControls);
      setTimeout(syncPreviewToStyleControls, 120);
    }
    if(document.readyState==='loading'){
      document.addEventListener('DOMContentLoaded', initialiseQrPage);
    }else{
      initialiseQrPage();
    }
</script>
