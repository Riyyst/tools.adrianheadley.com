<script>
(function(){
  'use strict';

  const longUrl=document.getElementById('longUrl');
  const shortUrl=document.getElementById('shortUrl');
  const shortenButton=document.getElementById('shorten');
  const copyButton=document.getElementById('copyBtn');
  const result=document.getElementById('result');
  const year=document.getElementById('year');

  year.textContent=new Date().getFullYear();

  function normalise(value){
    let text=(value||'').trim();
    if(!text) return '';

    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(text)){
      text='https://'+text;
    }

    try{
      const parsed=new URL(text);
      if(!/^https?:$/.test(parsed.protocol)) return '';
      return parsed.toString();
    }catch{
      return '';
    }
  }

  async function shortenUrl(url){
    const controller=new AbortController();
    const timeout=setTimeout(()=>controller.abort(),12000);

    try{
      const response=await fetch('https://shrtr.top/api/v1/shorten',{
        method:'POST',
        mode:'cors',
        credentials:'omit',
        cache:'no-store',
        headers:{
          'Content-Type':'application/json',
          'Accept':'application/json'
        },
        body:JSON.stringify({url}),
        signal:controller.signal
      });

      let data={};

      try{
        data=await response.json();
      }catch{
        throw new Error('The shortening service returned an invalid response.');
      }

      if(!response.ok){
        throw new Error(
          data.detail||
          data.title||
          'The URL could not be shortened.'
        );
      }

      if(!data.short_url){
        throw new Error('The shortening service did not return a short URL.');
      }

      return data.short_url;
    }finally{
      clearTimeout(timeout);
    }
  }

  async function generate(){
    const url=normalise(longUrl.value);

    if(!url){
      longUrl.focus();
      return;
    }

    shortenButton.disabled=true;
    result.classList.remove('hidden');
    shortUrl.value='Working…';
    copyButton.disabled=true;

    try{
      const cacheKey='riyst-short-url:'+url;
      let shortened='';

      try{
        shortened=sessionStorage.getItem(cacheKey)||'';
      }catch{}

      if(!shortened){
        shortened=await shortenUrl(url);

        try{
          sessionStorage.setItem(cacheKey,shortened);
        }catch{}
      }

      shortUrl.value=shortened;
      copyButton.disabled=false;
    }catch(error){
      shortUrl.value=
        error&&error.name==='AbortError'
          ? 'The shortening service timed out.'
          : (error instanceof Error
              ? error.message
              : 'The URL could not be shortened.');

      copyButton.disabled=true;
    }finally{
      shortenButton.disabled=false;
    }
  }

  shortenButton.addEventListener('click',generate);

  longUrl.addEventListener('keydown',event=>{
    if(event.key==='Enter'){
      event.preventDefault();
      generate();
    }
  });

  longUrl.addEventListener('input',()=>{
    result.classList.add('hidden');
    shortUrl.value='';
    copyButton.disabled=true;
  });

  copyButton.addEventListener('click',async()=>{
    if(!shortUrl.value||copyButton.disabled) return;

    try{
      await navigator.clipboard.writeText(shortUrl.value);
    }catch{
      shortUrl.select();
      document.execCommand('copy');
      window.getSelection()?.removeAllRanges();
    }

    copyButton.textContent='Copied';
    setTimeout(()=>copyButton.textContent='Copy',1200);
  });

  const syncCopyAvailability=()=>{
    copyButton.disabled=!String(document.getElementById('shortUrl')?.value||'').trim();
  };
  new MutationObserver(syncCopyAvailability).observe(result,{attributes:true,childList:true,subtree:true});
  document.getElementById('shorten')?.addEventListener('click',()=>{
    setTimeout(syncCopyAvailability,80);
    setTimeout(syncCopyAvailability,700);
    setTimeout(syncCopyAvailability,1800);
  });
  syncCopyAvailability();

})();
</script>
