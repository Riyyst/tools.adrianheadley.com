<style>

    color:#fff;
  }
  .seg label:hover{
    transform:translateY(-1px);
    background:rgba(148,163,184,.15);
  }
  .seg input:checked + label:hover{
    background:var(--accent-hover);
  }

    display:grid;

    align-items:center;

      linear-gradient(-45deg, transparent 75%, #eef2f7 75%);

    background-position:0 0,0 11px,11px -11px,-11px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    padding:1rem;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.85);

    max-width:100%;
    border-radius:14px;
    box-shadow:0 12px 28px rgba(15,23,42,.12);

  #canvas.can-drag{

    touch-action:none;
  }

  }

  .actions{

    justify-content:center;

    flex-wrap:wrap;
    margin-top:var(--stack-gap);

    align-items:center;
    justify-content:center;
    gap:.55rem;
    padding:.65rem 1.3rem;
    border-radius:var(--radius-pill);
    border:1px solid transparent;
    background:var(--accent);
    color:#f9fafb;
    font-size:.86rem;
    font-weight:600;

  .btn:hover:not([disabled]){

    box-shadow:0 10px 25px rgba(37,99,235,.18);
  }
  .btn[disabled]{
    opacity:.45;
    cursor:not-allowed;
  }

  footer.site-footer{
    margin-top:auto;
    padding:1.6rem 1.5rem 1.8rem;
    font-size:.85rem;

  }
  .fine{font-size:.95rem;color:var(--text-soft)}
  .footer-legal{

    justify-content:center;
    gap:.45rem;

    flex-wrap:wrap;
  }
  .footer-legal a{

  .footer-legal a:hover{
    color:var(--accent);
    background:rgba(148,163,184,.16);
    text-decoration:none;

  @media (max-width:760px){
    .container{width:min(100% - 2rem,var(--max-w))}

    .tool{padding:1.6rem 0 3rem}

    .color-wrap{grid-template-columns:48px minmax(0,1fr)}

    // File
    fileBtn.addEventListener('click', ()=> fileEl.click());
    fileEl.addEventListener('change', async ()=>{
      const f = fileEl.files?.[0];
      if(!f) return;
      filenameEl.textContent = f.name;
      originalBase = f.name.replace(/\.[^.]+$/,'') || 'image';
      customFillPosition = false;
      fillDx = 0;
      fillDy = 0;
      fillZoom = 1;
      fillZoom = 1;
      img = await readImage(f);
      render();
    });

    function readImage(f){
      return new Promise((resolve,reject)=>{
        const r = new FileReader();
        r.onload = e => { const im = new Image(); im.onload = ()=>resolve(im); im.onerror = ()=>reject(new Error('Load error')); im.src = e.target.result; };
        r.onerror = ()=>reject(new Error('Read error'));
        r.readAsDataURL(f);
      });
    }

    function dimsOK(){
      const tw = parseInt(wEl.value,10);
      const th = parseInt(hEl.value,10);
      return Number.isFinite(tw)&&tw>0 && Number.isFinite(th)&&th>0 ? [tw,th] : null;
    }

    function setMode(m){
      mode = m;
      customFillPosition = false;
      fillDx = 0;
      fillDy = 0;
      fitRadio.checked = m==='fit'; fillRadio.checked = m==='fill';
      fitRadio2.checked = m==='fit'; fillRadio2.checked = m==='fill';
      rowFit.style.display = m==='fit' ? '' : 'none';
      rowFill.style.display = m==='fill' ? '' : 'none';
      render();
    }
    fitRadio.addEventListener('change', ()=>setMode('fit'));
    fillRadio.addEventListener('change', ()=>setMode('fill'));
    fitRadio2.addEventListener('change', ()=>setMode('fit'));
    fillRadio2.addEventListener('change', ()=>setMode('fill'));

    const normHex = v => { v=(v||'').trim(); if(!v.startsWith('#')) v='#'+v; return /^#([0-9a-fA-F]{6})$/.test(v)?v.toUpperCase():null; };
    bgEl.addEventListener('input', ()=>{
      bgHexEl.value = bgEl.value.toUpperCase();
      render();
    });
    bgEl.addEventListener('change', ()=>{
      bgHexEl.value = bgEl.value.toUpperCase();
      bgEl.blur();
      document.body.style.overflowY = 'auto';
      render();
    });
    bgHexEl.addEventListener('input', ()=>{
      const v=normHex(bgHexEl.value);
      if(v) bgEl.value=v;
      document.body.style.overflowY = 'auto';
      render();
    });

    [wEl,hEl,formatEl,formatEl2].forEach(el=>{
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    });
    alignEl.addEventListener('change', ()=>{
      customFillPosition = false;
      fillDx = 0;
      fillDy = 0;
      fillZoom = 1;
      render();
    });

    
    // Detect if current image contains any transparent pixels (sampling for performance)
    function __hasAlpha(im){
      try{
        const sw = im.naturalWidth || im.width;
        const sh = im.naturalHeight || im.height;
        if(!sw || !sh) return false;
        const maxSamples = 64000;
        const scale = Math.min(1, Math.sqrt(maxSamples / (sw*sh)));
        const cw = Math.max(1, Math.floor(sw * scale));
        const ch = Math.max(1, Math.floor(sh * scale));
        const c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        const cctx = c.getContext('2d');
        cctx.clearRect(0,0,cw,ch); // preserve alpha
        cctx.drawImage(im, 0,0, sw,sh, 0,0, cw,ch);
        const data = cctx.getImageData(0,0,cw,ch).data;
        for(let i=3;i<data.length;i+=4){ if(data[i] < 255){ return true; } }
      }catch(e){ /* cross-origin or other error; assume no alpha to avoid surprise */ }
      return false;
    }

    function render(){
      const d = dimsOK();
      if(!img || !d){
        canvasWrap.classList.add('hidden');
        dragHint.classList.add('hidden');
        previewCanvas.classList.remove('can-drag');
        fillBounds = null;
        fillDraw = null;
        previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
        downloadBtn.disabled = true;
        return;
      }

      canvasWrap.classList.remove('hidden');
      dragHint.classList.toggle('hidden', mode !== 'fill');
      previewCanvas.classList.toggle('can-drag', mode === 'fill');

      const [tw,th] = d;

      // Draw exact output
      exportCanvas.width = tw; exportCanvas.height = th;
      const sw = img.naturalWidth || img.width;
      const sh = img.naturalHeight || img.height;

      exportCtx.save();
      exportCtx.imageSmoothingEnabled = true;
      exportCtx.imageSmoothingQuality = 'high';

      if(mode==='fit'){
        const scale = Math.min(tw/sw, th/sh);
        const dw = Math.round(sw*scale), dh = Math.round(sh*scale);
        const dx = Math.floor((tw-dw)/2), dy = Math.floor((th-dh)/2);
        const fmt = (mode==='fit'?formatEl.value:formatEl2.value);
        const __imgHasAlpha = __hasAlpha(img);
        if(!(fmt==='png' && __imgHasAlpha)){
          exportCtx.fillStyle = bgEl.value;
          exportCtx.fillRect(0,0,tw,th);
        }else{
          exportCtx.clearRect(0,0,tw,th); // keep full transparency when exporting transparent PNGs
        }
        exportCtx.drawImage(img,0,0,sw,sh,dx,dy,dw,dh);
        fillBounds = null;
        fillDraw = null;
      }else{
        const scale = Math.max(tw/sw, th/sh) * fillZoom;
        const dw = Math.round(sw*scale), dh = Math.round(sh*scale);
        let dx = Math.floor((tw-dw)/2), dy = Math.floor((th-dh)/2);
        const a = alignEl.value;
        if(a?.includes('left')) dx = 0;
        if(a?.includes('right')) dx = tw - dw;
        if(a?.includes('top')) dy = 0;
        if(a?.includes('bottom')) dy = th - dh;

        // Free-position drag bounds.
        // This allows the image to be moved anywhere within the frame area,
        // rather than only being locked to the crop edges.
        const minX = -dw;
        const maxX = tw;
        const minY = -dh;
        const maxY = th;

        if(customFillPosition){
          dx = fillDx;
          dy = fillDy;
        }

        dx = Math.max(minX, Math.min(maxX, dx));
        dy = Math.max(minY, Math.min(maxY, dy));
        fillDx = dx;
        fillDy = dy;
        fillBounds = { minX, maxX, minY, maxY, tw, th };
        fillDraw = { dx, dy, dw, dh, tw, th, scale };

        exportCtx.clearRect(0,0,tw,th);
        exportCtx.drawImage(img,dx,dy,dw,dh);
      }
      exportCtx.restore();

      // HiDPI preview
      const available = canvasWrap.clientWidth;
      const cssW = Math.min(available, tw);
      const scale = cssW / tw;
      const dpr = window.devicePixelRatio || 1;

      previewCanvas.style.width = cssW + 'px';
      previewCanvas.style.height = Math.round(th * scale) + 'px';
      previewCanvas.width = Math.round(cssW * dpr);
      previewCanvas.height = Math.round(th * scale * dpr);

      previewCtx.save();
      previewCtx.imageSmoothingEnabled = true;
      previewCtx.imageSmoothingQuality = 'high';
      previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
      previewCtx.drawImage(exportCanvas, 0,0, tw,th, 0,0, previewCanvas.width, previewCanvas.height);
      previewCtx.restore();

      downloadBtn.disabled = false;
    }


    function previewScaleToOutput(){
      const d = dimsOK();
      if(!d) return null;
      const [tw] = d;
      const rect = previewCanvas.getBoundingClientRect();
      if(!rect.width || !tw) return null;
      return tw / rect.width;
    }

    function canDragFill(){
      return mode === 'fill' && img && dimsOK() && fillBounds;
    }

    function clampFillPosition(){
      if(!fillBounds) return;
      fillDx = Math.max(fillBounds.minX, Math.min(fillBounds.maxX, fillDx));
      fillDy = Math.max(fillBounds.minY, Math.min(fillBounds.maxY, fillDy));
    }

    function outputPointFromClient(clientX, clientY){
      const d = dimsOK();
      if(!d) return null;
      const [tw, th] = d;
      const rect = previewCanvas.getBoundingClientRect();
      if(!rect.width || !rect.height) return null;
      return {
        x:(clientX - rect.left) * (tw / rect.width),
        y:(clientY - rect.top) * (th / rect.height)
      };
    }

    function setFillZoom(newZoom, anchor){
      if(!canDragFill() || !fillDraw) return;
      const oldZoom = fillZoom;
      newZoom = Math.max(minFillZoom, Math.min(maxFillZoom, newZoom));
      if(Math.abs(newZoom - oldZoom) < 0.001) return;

      const factor = newZoom / oldZoom;
      const point = anchor || { x: fillBounds.tw / 2, y: fillBounds.th / 2 };

      fillDx = point.x - (point.x - fillDx) * factor;
      fillDy = point.y - (point.y - fillDy) * factor;
      fillZoom = newZoom;
      customFillPosition = true;
      render();
      clampFillPosition();
      render();
    }

    function distanceBetweenTouches(touches){
      if(!touches || touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    function centreBetweenTouches(touches){
      if(!touches || touches.length < 2) return null;
      return outputPointFromClient(
        (touches[0].clientX + touches[1].clientX) / 2,
        (touches[0].clientY + touches[1].clientY) / 2
      );
    }

    previewCanvas.addEventListener('pointerdown', (e)=>{
      if(!canDragFill()) return;
      e.preventDefault();
      dragActive = true;
      customFillPosition = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragBaseX = fillDx;
      dragBaseY = fillDy;
      previewCanvas.setPointerCapture?.(e.pointerId);
    });

    previewCanvas.addEventListener('pointermove', (e)=>{
      if(!dragActive || !canDragFill()) return;
      e.preventDefault();
      const factor = previewScaleToOutput();
      if(!factor) return;
      fillDx = Math.max(fillBounds.minX, Math.min(fillBounds.maxX, dragBaseX + (e.clientX - dragStartX) * factor));
      fillDy = Math.max(fillBounds.minY, Math.min(fillBounds.maxY, dragBaseY + (e.clientY - dragStartY) * factor));
      render();
    });

    function endDrag(e){
      if(!dragActive) return;
      dragActive = false;
      try{ previewCanvas.releasePointerCapture?.(e.pointerId); }catch(_){}
    }

    previewCanvas.addEventListener('pointerup', endDrag);
    previewCanvas.addEventListener('pointercancel', endDrag);
    previewCanvas.addEventListener('pointerleave', endDrag);


    previewCanvas.addEventListener('wheel', (e)=>{
      if(!canDragFill()) return;
      e.preventDefault();
      const anchor = outputPointFromClient(e.clientX, e.clientY);
      const factor = Math.exp(-e.deltaY * 0.0015);
      setFillZoom(fillZoom * factor, anchor);
    }, { passive:false });

    previewCanvas.addEventListener('touchstart', (e)=>{
      if(!canDragFill() || e.touches.length !== 2) return;
      e.preventDefault();
      pinchActive = true;
      pinchStartDistance = distanceBetweenTouches(e.touches);
      pinchStartZoom = fillZoom;
      pinchStartDx = fillDx;
      pinchStartDy = fillDy;
      pinchCenter = centreBetweenTouches(e.touches);
    }, { passive:false });

    previewCanvas.addEventListener('touchmove', (e)=>{
      if(!pinchActive || !canDragFill() || e.touches.length !== 2) return;
      e.preventDefault();
      const now = distanceBetweenTouches(e.touches);
      if(!pinchStartDistance) return;

      const newZoom = Math.max(minFillZoom, Math.min(maxFillZoom, pinchStartZoom * (now / pinchStartDistance)));
      const factor = newZoom / pinchStartZoom;
      const point = pinchCenter || { x: fillBounds.tw / 2, y: fillBounds.th / 2 };

      fillDx = point.x - (point.x - pinchStartDx) * factor;
      fillDy = point.y - (point.y - pinchStartDy) * factor;
      fillZoom = newZoom;
      customFillPosition = true;
      render();
      clampFillPosition();
      render();
    }, { passive:false });

    previewCanvas.addEventListener('touchend', (e)=>{
      if(e.touches && e.touches.length < 2) pinchActive = false;
    }, { passive:true });

    // Download
    downloadBtn.addEventListener('click', ()=>{
      const d = dimsOK(); if(!d) return;
      const [tw,th] = d;
      const fmt = (mode==='fit'?formatEl.value:formatEl2.value);
      const name = `${originalBase}_resized_${tw}x${th}.${fmt}`;
      const mime = (fmt==='png') ? 'image/png' : 'image/jpeg';
      const quality = (fmt==='png') ? undefined : 0.92;

      exportCanvas.toBlob(blob=>{
        if(!blob){
          const dataURL = exportCanvas.toDataURL(mime, quality);
          triggerDownload(name, dataURL);
          return;
        }
        const url = URL.createObjectURL(blob);
        triggerDownload(name, url, true);
      }, mime, quality);

      function triggerDownload(filename, href, revoke=false){
        const a = document.createElement('a');
        a.download = filename; a.href = href; document.body.appendChild(a); a.click(); a.remove();
        if(revoke) setTimeout(()=>URL.revokeObjectURL(href), 1000);
      }
    });

    // Keep preview crisp on resize
    window.addEventListener('resize', ()=>{ clearTimeout(window.__rt); window.__rt = setTimeout(render, 120); });

    // Init
    setMode('fit');
    canvasWrap.classList.add('hidden');
</script>
