<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teleprompter Desktop</title>
<style>
:root{--text:#475569;--accent:#2563eb;--accent-hover:#1d4ed8;--border:#d7dde5;--alpha:.50}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{position:fixed;inset:0;background:rgba(226,232,240,.18);color:var(--text);overflow:hidden}.screen,.camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}.screen.on,.camera.on{opacity:1}.camera{transform:scaleX(-1)}.camera.pip{inset:auto 18px 86px auto;width:180px;height:180px;border-radius:18px;border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 28px rgba(15,23,42,.18);z-index:6;cursor:grab}.tint{position:absolute;inset:0;z-index:2;background:rgba(226,232,240,var(--alpha));pointer-events:none}.scroller{position:absolute;inset:0 0 74px;z-index:4;overflow:auto;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}.script{width:min(980px,88%);margin:0 auto;padding:42vh 0 52vh;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;font-size:48px;line-height:1.42;font-weight:650;color:var(--text);outline:none;caret-color:var(--accent)}.script.empty:before{content:attr(data-placeholder);color:var(--text)}.script.empty:focus:before{content:""}.guide{position:absolute;left:3%;right:3%;top:41%;z-index:5;height:1px;background:rgba(37,99,235,.24);pointer-events:none}.titlebar{position:absolute;left:10px;right:10px;top:8px;z-index:20;display:flex;align-items:center;justify-content:space-between;min-height:36px;padding:.25rem .35rem .25rem .7rem;border:1px solid rgba(148,163,184,.45);border-radius:12px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-app-region:drag}.titlebar strong{font-size:.75rem;color:#334155}.winbuttons{display:flex;gap:.2rem;-webkit-app-region:no-drag}.iconbtn{width:30px;height:28px;padding:0;border:1px solid transparent;border-radius:8px;background:transparent;color:#475569;font-weight:800}.iconbtn:hover{background:#eef2f7}.iconbtn.close:hover{background:#fee2e2;color:#b91c1c}.toolbar{position:absolute;left:10px;right:10px;bottom:10px;z-index:20;min-height:52px;padding:.38rem;display:grid;grid-template-columns:max-content minmax(0,1fr) max-content;align-items:center;gap:.3rem;border:1px solid rgba(148,163,184,.45);border-radius:14px;background:rgba(255,255,255,.90);backdrop-filter:blur(12px);box-shadow:0 8px 22px rgba(15,23,42,.07)}.group,.sliders{display:flex;align-items:center;gap:.28rem;min-width:0}.sliders{justify-content:center}.btn{min-height:34px;padding:.42rem .58rem;border:1px solid transparent;border-radius:999px;background:var(--accent);color:#fff;font-size:.69rem;font-weight:760;white-space:nowrap}.btn:hover{background:var(--accent-hover)}.btn.secondary{background:#fff;color:#111827;border-color:#cfd6df}.btn.active{background:var(--accent);color:#fff}.btn.recording{background:#dc2626;border-color:#dc2626}.control{max-width:145px;display:grid;grid-template-columns:max-content minmax(34px,1fr) 38px;align-items:center;gap:.22rem;padding:.23rem .32rem;border:1px solid #e5e7eb;border-radius:10px;background:#f8fafc}.control label,.value{font-size:.61rem;font-weight:800;white-space:nowrap}.value{color:var(--accent);text-align:right}input[type=range]{width:100%;min-width:0;height:20px;margin:0;accent-color:var(--accent)}.source-panel{position:absolute;inset:52px 16px auto auto;z-index:30;width:min(420px,calc(100% - 32px));display:none;flex-direction:column;gap:.5rem;padding:.75rem;border:1px solid #d6dde6;border-radius:16px;background:rgba(255,255,255,.97);box-shadow:0 18px 42px rgba(15,23,42,.16)}.source-panel.open{display:flex}.source-panel h2{margin:0;font-size:.9rem}.source-panel p{margin:0;color:#64748b;font-size:.73rem}#sourceSelect{width:100%;padding:.65rem .75rem;border:1px solid #cfd6df;border-radius:10px;background:#fff}.source-actions{display:flex;justify-content:flex-end;gap:.4rem}.rec{position:absolute;top:54px;right:16px;z-index:19;display:none;align-items:center;gap:.4rem;padding:.38rem .58rem;border:1px solid rgba(185,28,28,.24);border-radius:999px;background:rgba(255,255,255,.88);color:#b91c1c;font-size:.7rem;font-weight:800}.rec.show{display:flex}.dot{width:8px;height:8px;border-radius:50%;background:#dc2626}.hint{position:absolute;left:16px;top:54px;z-index:19;display:none;padding:.38rem .58rem;border-radius:999px;background:rgba(255,255,255,.88);color:#475569;font-size:.68rem;font-weight:700}.hint.show{display:block}@media(max-width:1000px){.toolbar .btn span{display:none}.toolbar .btn{width:34px;padding:0}.control{max-width:none}}
</style>
</head>
<body>
<div id="app"><video id="screenVideo" class="screen" autoplay muted playsinline></video><video id="cameraVideo" class="camera" autoplay muted playsinline></video><div class="tint"></div><div class="guide"></div><div class="titlebar"><strong>Teleprompter Desktop</strong><div class="winbuttons"><button class="iconbtn" id="minBtn">—</button><button class="iconbtn" id="maxBtn">□</button><button class="iconbtn close" id="closeBtn">×</button></div></div><div id="scroller" class="scroller"><div id="script" class="script empty" contenteditable="true" spellcheck="true" data-placeholder="Click here and type or paste your script"></div></div><div class="rec" id="recIndicator"><span class="dot"></span><span id="recTime">00:00</span></div><div class="hint" id="hint"></div><div class="toolbar"><div class="group"><button class="btn" id="playBtn"><span>Start</span></button><button class="btn secondary" id="restartBtn"><span>Restart</span></button><button class="btn secondary active" id="cameraBtn"><span>Camera</span></button><button class="btn secondary" id="recordBtn"><span>Record</span></button></div><div class="sliders"><div class="control"><label>Speed</label><input id="speed" type="range" min="10" max="180" value="58"><span class="value" id="speedVal">58</span></div><div class="control"><label>Text</label><input id="fontSize" type="range" min="28" max="82" value="48"><span class="value" id="fontVal">48</span></div><div class="control"><label>Tint</label><input id="tint" type="range" min="0" max="80" value="50"><span class="value" id="tintVal">50%</span></div></div><div class="group"><button class="btn secondary" id="overlayBtn"><span>Overlay</span></button><button class="btn secondary" id="prevBtn"><span>Previous</span></button><button class="btn secondary" id="nextBtn"><span>Next</span></button><button class="btn secondary" id="arrangeBtn"><span>Control screen</span></button><button class="btn secondary" id="clickBtn"><span>Click through</span></button></div></div><div class="source-panel" id="sourcePanel"><h2>Choose a window or screen</h2><p>Select the application you are presenting or demonstrating.</p><select id="sourceSelect"></select><div class="source-actions"><button class="btn secondary" id="cancelSource">Cancel</button><button class="btn" id="useSource">Use selected</button></div></div></div>
<script>
(()=>{'use strict';const api=window.desktopTeleprompter,app=document.getElementById('app'),scroller=document.getElementById('scroller'),script=document.getElementById('script'),screenVideo=document.getElementById('screenVideo'),cameraVideo=document.getElementById('cameraVideo'),playBtn=document.getElementById('playBtn'),restartBtn=document.getElementById('restartBtn'),cameraBtn=document.getElementById('cameraBtn'),recordBtn=document.getElementById('recordBtn'),overlayBtn=document.getElementById('overlayBtn'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),arrangeBtn=document.getElementById('arrangeBtn'),clickBtn=document.getElementById('clickBtn'),speed=document.getElementById('speed'),fontSize=document.getElementById('fontSize'),tint=document.getElementById('tint'),speedVal=document.getElementById('speedVal'),fontVal=document.getElementById('fontVal'),tintVal=document.getElementById('tintVal'),sourcePanel=document.getElementById('sourcePanel'),sourceSelect=document.getElementById('sourceSelect'),useSource=document.getElementById('useSource'),cancelSource=document.getElementById('cancelSource'),recIndicator=document.getElementById('recIndicator'),recTime=document.getElementById('recTime'),hint=document.getElementById('hint');let running=false,last=performance.now(),cameraStream=null,screenStream=null,selectedSource=null,recorder=null,chunks=[],recordTimer=0,recordStarted=0,arranged=false,drag=null;function showHint(m,ms=3200){hint.textContent=m;hint.classList.add('show');clearTimeout(showHint.t);showHint.t=setTimeout(()=>hint.classList.remove('show'),ms)}function empty(){script.classList.toggle('empty',!(script.innerText||'').trim())}script.oninput=empty;script.onpaste=e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))};speed.oninput=()=>speedVal.textContent=speed.value;fontSize.oninput=()=>{fontVal.textContent=fontSize.value;script.style.fontSize=fontSize.value+'px'};tint.oninput=()=>{tintVal.textContent=tint.value+'%';app.style.setProperty('--alpha',Number(tint.value)/100)};function loop(now){const dt=Math.min(50,now-last);last=now;if(running)scroller.scrollTop+=Number(speed.value)*(dt/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop);playBtn.onclick=()=>{running=!running;playBtn.querySelector('span').textContent=running?'Pause':'Start'};restartBtn.onclick=()=>{scroller.scrollTop=0;running=false;playBtn.querySelector('span').textContent='Start'};async function enableCamera(){if(cameraStream?.getVideoTracks().some(t=>t.readyState==='live'))return cameraStream;cameraStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});cameraVideo.srcObject=cameraStream;cameraVideo.classList.add('on');cameraBtn.classList.add('active');updateCam();return cameraStream}function disableCamera(){cameraStream?.getTracks().forEach(t=>t.stop());cameraStream=null;cameraVideo.srcObject=null;cameraVideo.classList.remove('on','pip');cameraBtn.classList.remove('active')}cameraBtn.onclick=async()=>{try{cameraStream?disableCamera():await enableCamera();updateCam()}catch(e){showHint('Camera permission was not granted.')}};function updateCam(){cameraVideo.classList.toggle('pip',!!screenStream&&!!cameraStream)}async function openSources(){const sources=await api.getSources();sourceSelect.innerHTML='';sources.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.name;sourceSelect.appendChild(o)});sourcePanel.classList.add('open')}overlayBtn.onclick=async()=>{if(screenStream){stopOverlay();return}await openSources()};cancelSource.onclick=()=>sourcePanel.classList.remove('open');async function captureSource(id){return navigator.mediaDevices.getUserMedia({audio:false,video:{mandatory:{chromeMediaSource:'desktop',chromeMediaSourceId:id,minWidth:640,maxWidth:3840,minHeight:360,maxHeight:2160}}})}useSource.onclick=async()=>{try{selectedSource={id:sourceSelect.value,name:sourceSelect.options[sourceSelect.selectedIndex]?.textContent||''};screenStream=await captureSource(selectedSource.id);screenVideo.srcObject=screenStream;screenVideo.classList.add('on');overlayBtn.classList.add('active');sourcePanel.classList.remove('open');updateCam();screenStream.getVideoTracks()[0]?.addEventListener('ended',stopOverlay,{once:true});showHint('Overlay ready.')}catch(e){showHint('Could not capture that window or screen.')}};function stopOverlay(){screenStream?.getTracks().forEach(t=>t.stop());screenStream=null;screenVideo.srcObject=null;screenVideo.classList.remove('on');overlayBtn.classList.remove('active');updateCam()}arrangeBtn.onclick=async()=>{try{if(arranged){await api.restoreArrangement();arranged=false;arrangeBtn.classList.remove('active');arrangeBtn.querySelector('span').textContent='Control screen';return}if(!selectedSource?.id){await openSources();showHint('Choose the application first, then press Control screen.');return}await api.arrangeSelectedWindow(selectedSource.id);arranged=true;arrangeBtn.classList.add('active');arrangeBtn.querySelector('span').textContent='Full overlay'}catch(e){showHint(e.message||'Could not arrange that application.')}};clickBtn.onclick=async()=>{const v=await api.setClickThrough(true);clickBtn.classList.toggle('active',v);clickBtn.querySelector('span').textContent=v?'Ctrl+Shift+T':'Click through';if(v)showHint('Clicks pass through. Press Ctrl+Shift+T to regain control.',5000)};api.onClickThroughChanged(v=>{clickBtn.classList.toggle('active',v);clickBtn.querySelector('span').textContent=v?'Ctrl+Shift+T':'Click through'});prevBtn.onclick=async()=>{try{await api.sendPresentationKey('previous')}catch(e){showHint(e.message)}};nextBtn.onclick=async()=>{try{await api.sendPresentationKey('next')}catch(e){showHint(e.message)}};async function recordingStream(){let mic=null;try{mic=await navigator.mediaDevices.getUserMedia({audio:true,video:false})}catch(e){}if(screenStream){const sv=document.createElement('video');sv.srcObject=screenStream;sv.muted=true;await sv.play();const c=document.createElement('canvas'),set=screenStream.getVideoTracks()[0].getSettings();c.width=set.width||1920;c.height=set.height||1080;const ctx=c.getContext('2d');let cv=null;if(cameraStream){cv=document.createElement('video');cv.srcObject=cameraStream;cv.muted=true;await cv.play()}let run=true;(function draw(){if(!run)return;ctx.drawImage(sv,0,0,c.width,c.height);if(cv){const size=Math.round(Math.min(c.width,c.height)*.22),m=Math.round(size*.08);ctx.save();ctx.translate(c.width-m,c.height-m);ctx.scale(-1,1);ctx.drawImage(cv,0,-size,-size,size);ctx.restore()}requestAnimationFrame(draw)})();const out=c.captureStream(30);mic?.getAudioTracks().forEach(t=>out.addTrack(t));out.cleanup=()=>{run=false;mic?.getTracks().forEach(t=>t.stop())};return out}await enableCamera();const out=new MediaStream();cameraStream.getVideoTracks().forEach(t=>out.addTrack(t));mic?.getAudioTracks().forEach(t=>out.addTrack(t));out.cleanup=()=>mic?.getTracks().forEach(t=>t.stop());return out}recordBtn.onclick=async()=>{if(recorder&&recorder.state!=='inactive'){recorder.stop();return}try{const rs=await recordingStream();chunks=[];recorder=new MediaRecorder(rs);recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>{clearInterval(recordTimer);recIndicator.classList.remove('show');recordBtn.classList.remove('recording');recordBtn.querySelector('span').textContent='Record';const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='teleprompter-recording.webm';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);rs.cleanup?.()};recorder.start(1000);recordStarted=Date.now();recordBtn.classList.add('recording');recordBtn.querySelector('span').textContent='Recording';recIndicator.classList.add('show');recordTimer=setInterval(()=>{const s=Math.floor((Date.now()-recordStarted)/1000);recTime.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},250)}catch(e){showHint('Recording could not start.')}};cameraVideo.onpointerdown=e=>{if(!cameraVideo.classList.contains('pip'))return;cameraVideo.setPointerCapture(e.pointerId);const r=cameraVideo.getBoundingClientRect();drag={dx:e.clientX-r.left,dy:e.clientY-r.top}};cameraVideo.onpointermove=e=>{if(!drag)return;const r=cameraVideo.getBoundingClientRect(),left=Math.max(8,Math.min(innerWidth-r.width-8,e.clientX-drag.dx)),top=Math.max(44,Math.min(innerHeight-r.height-78,e.clientY-drag.dy));cameraVideo.style.left=left+'px';cameraVideo.style.top=top+'px';cameraVideo.style.right='auto';cameraVideo.style.bottom='auto'};cameraVideo.onpointerup=()=>drag=null;document.getElementById('minBtn').onclick=()=>api.minimise();document.getElementById('maxBtn').onclick=()=>api.toggleMaximise();document.getElementById('closeBtn').onclick=()=>api.close();enableCamera().catch(()=>showHint('Allow camera access to see yourself.'));empty()})();
</script>
